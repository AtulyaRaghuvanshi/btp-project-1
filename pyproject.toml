[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xgf"
version = "0.1.0"
description = "Cross-Generator Faithfulness: perturbation-artifact bias in explanation evaluation for deepfake detection"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
